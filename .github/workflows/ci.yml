name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-flow:
    name: validate-pr-flow
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate pull request source and target branches
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${BASE_REF}" = "main" ] && [ "${HEAD_REF}" != "develop" ]; then
            echo "Pull requests into main are allowed only from develop."
            exit 1
          fi

          if [ "${BASE_REF}" = "develop" ] && { [ "${HEAD_REF}" = "main" ] || [ "${HEAD_REF}" = "develop" ]; }; then
            echo "Pull requests into develop must come from a branch other than main or develop."
            exit 1
          fi

          echo "Pull request branch flow is valid."

  lint:
    name: lint
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    name: build
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    needs:
      - validate-pr-flow
      - lint
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
