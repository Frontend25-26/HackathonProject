name: Обновить статус в проекте при ревью

on:
  pull_request:
    types: [labeled]

permissions:
  issues: read
  pull-requests: read

jobs:
  update-project-status:
    if: github.event.label.name == 'needs-review'
    runs-on: ubuntu-latest

    steps:
      - name: Перевести issue в "In review" в GitHub Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            // Извлекаем номер issue из "Closes #58"
            const issueMatch = prBody.match(/[Cc]loses\s+#(\d+)/);
            if (!issueMatch) {
              core.info('Issue не найден в описании PR. Пропускаем.');
              return;
            }

            const issueNumber = parseInt(issueMatch[1], 10);
            core.info(`Найден issue #${issueNumber}, ищем в GitHub Project...`);

            // Получаем issue и его проект через REST API
            try {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });

              core.info(`✓ Issue #${issueNumber} найден: "${issue.title}"`);

              // Используем GraphQL для получения projectItems
              const getProjectQuery = `
                query {
                  repository(owner: "${owner}", name: "${repo}") {
                    issue(number: ${issueNumber}) {
                      projectsV2(first: 10) {
                        nodes {
                          id
                          title
                        }
                      }
                    }
                  }
                }
              `;

              const projectResult = await github.graphql(getProjectQuery);
              const projectsV2 = projectResult.repository.issue.projectsV2.nodes;

              if (!projectsV2 || projectsV2.length === 0) {
                core.warning(`Issue #${issueNumber} не найден ни в одном проекте`);
                return;
              }

              const project = projectsV2[0];
              core.info(`✓ Найден проект "${project.title}" для issue #${issueNumber}`);

              // Теперь получаем детали проекта с полями и items
              const getProjectDetailsQuery = `
                query {
                  node(id: "${project.id}") {
                    ... on ProjectV2 {
                      id
                      items(first: 100, query: "number:${issueNumber}") {
                        nodes {
                          id
                        }
                      }
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const detailsResult = await github.graphql(getProjectDetailsQuery);
              const projectDetails = detailsResult.node;

              const projectItem = projectDetails.items.nodes[0];
              if (!projectItem) {
                core.warning(`Issue #${issueNumber} не найден в проекте "${project.title}"`);
                return;
              }

              const statusField = projectDetails.fields.nodes.find(f => f.name === 'Status');
              if (!statusField) {
                const fieldNames = projectDetails.fields.nodes.map(f => f.name).join(', ');
                core.setFailed(`Поле "Status" не найдено. Доступные поля: ${fieldNames}`);
                return;
              }

              const inReviewOption = statusField.options.find(o => o.name === 'In review');
              if (!inReviewOption) {
                const optionNames = statusField.options.map(o => o.name).join(', ');
                core.setFailed(`Статус "In review" не найден. Доступные статусы: ${optionNames}`);
                return;
              }

              core.info(`✓ Найдено поле Status (ID: ${statusField.id}) и статус "In review" (ID: ${inReviewOption.id})`);

              const projectId = project.id;
              const projectItemId = projectItem.id;
              const statusFieldId = statusField.id;

              // Обновляем статус на "In review"
              const updateMutation = `
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${projectId}"
                    itemId: "${projectItemId}"
                    fieldId: "${statusFieldId}"
                    value: {singleSelectOptionId: "${inReviewOption.id}"}
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;

              await github.graphql(updateMutation);
              core.info(`✓ Issue #${issueNumber} переведён в статус "In review" в проекте "${project.title}"`);

            } catch (error) {
              core.setFailed(`Ошибка: ${error.message}`);
            }
