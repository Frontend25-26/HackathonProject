name: Обновить статус в проекте при ревью

on:
  pull_request:
    types: [labeled]

permissions:
  issues: read
  pull-requests: read

jobs:
  update-project-status:
    if: github.event.label.name == 'needs-review'
    runs-on: ubuntu-latest

    steps:
      - name: Перевести issue в "In review" в GitHub Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            // Извлекаем номер issue из "Closes #58"
            const issueMatch = prBody.match(/[Cc]loses\s+#(\d+)/);
            if (!issueMatch) {
              core.info('Issue не найден в описании PR. Пропускаем.');
              return;
            }

            const issueNumber = parseInt(issueMatch[1], 10);
            core.info(`Найден issue #${issueNumber}, ищем в GitHub Project...`);

            // Получаем issue и вытаскиваем проект из него
            const getIssueQuery = `
              query {
                repository(owner: "${owner}", name: "${repo}") {
                  issue(number: ${issueNumber}) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                          title
                        }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field {
                              ... on ProjectV2SingleSelectField {
                                id
                                options {
                                  id
                                  name
                                }
                              }
                            }
                            optionId
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const issueResult = await github.graphql(getIssueQuery);
            const issueProjectItems = issueResult.repository.issue.projectItems.nodes;

            if (!issueProjectItems || issueProjectItems.length === 0) {
              core.warning(`Issue #${issueNumber} не привязан ни к одному проекту`);
              return;
            }

            const projectItem = issueProjectItems[0];
            core.info(`✓ Найден проект "${projectItem.project.title}" для issue #${issueNumber}`);

            const projectItemId = projectItem.id;
            const projectId = projectItem.project.id;
            const statusField = projectItem.fieldValueByName;

            if (!statusField?.field?.id) {
              core.setFailed('Поле Status не найдено для этого issue в проекте');
              return;
            }

            const statusFieldId = statusField.field.id;
            const inReviewOption = statusField.field.options?.find(o => o.name === 'In review');

            if (!inReviewOption) {
              const availableOptions = statusField.field.options?.map(o => o.name).join(', ') || 'нет опций';
              core.setFailed(`Статус "In review" не найден. Доступные статусы: ${availableOptions}`);
              return;
            }

            core.info(`✓ Статус "In review" найден, ID: ${inReviewOption.id}`);

            try {
              // Обновляем статус на "In review"
              const updateMutation = `
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${projectId}"
                    itemId: "${projectItemId}"
                    fieldId: "${statusFieldId}"
                    value: {singleSelectOptionId: "${inReviewOption.id}"}
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;

              await github.graphql(updateMutation);
              core.info(`✓ Issue #${issueNumber} переведён в статус "In review" в проекте "${projectItem.project.title}"`);

            } catch (error) {
              core.warning(`Ошибка при обновлении проекта: ${error.message}`);
            }
