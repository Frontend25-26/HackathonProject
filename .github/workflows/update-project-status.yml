name: Обновить статус в проекте при ревью

on:
  pull_request:
    types: [labeled]

permissions:
  issues: read
  pull-requests: read

jobs:
  update-project-status:
    if: github.event.label.name == 'needs-review'
    runs-on: ubuntu-latest

    steps:
      - name: Перевести issue в "In review" в GitHub Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            // Извлекаем номер issue из "Closes #58"
            const issueMatch = prBody.match(/[Cc]loses\s+#(\d+)/);
            if (!issueMatch) {
              core.info('Issue не найден в описании PR. Пропускаем.');
              return;
            }

            const issueNumber = parseInt(issueMatch[1], 10);
            core.info(`Найден issue #${issueNumber}, ищем в GitHub Project...`);

            // Получаем issue через REST API и ищем проект в организации
            try {
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });

              core.info(`✓ Issue #${issueNumber} найден: "${issue.title}"`);

              // Ищем проект организации напрямую
              const findProjectQuery = `
                query {
                  organization(login: "Frontend25-26") {
                    projectsV2(first: 10) {
                      nodes {
                        id
                        title
                        items(first: 100, query: "number:${issueNumber}") {
                          totalCount
                          nodes {
                            id
                            content {
                              ... on Issue {
                                number
                                repository {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const projectsResult = await github.graphql(findProjectQuery);
              const allProjects = projectsResult.organization.projectsV2.nodes;

              core.info(`📊 Всего проектов в организации: ${allProjects.length}`);
              core.info(`📋 Детали проектов:\n${JSON.stringify(allProjects.map(p => ({
                title: p.title,
                id: p.id,
                itemsCount: p.items.totalCount,
                issues: p.items.nodes.map(i => ({ number: i.content?.number, repo: i.content?.repository?.name }))
              })), null, 2)}`);

              // Ищем проект в котором есть наш issue
              const projectWithIssue = allProjects.find(p =>
                p.items.totalCount > 0 &&
                p.items.nodes.some(item => item.content?.number === issueNumber)
              );

              if (!projectWithIssue) {
                core.warning(`❌ Issue #${issueNumber} не найден ни в одном проекте организации`);
                core.warning(`Ищем issue #${issueNumber}. Проверено проектов: ${allProjects.length}`);
                return;
              }

              const project = projectWithIssue;
              core.info(`✓ Найден проект "${project.title}" для issue #${issueNumber}`);

              // Теперь получаем детали проекта с полями и items
              const getProjectDetailsQuery = `
                query {
                  node(id: "${project.id}") {
                    ... on ProjectV2 {
                      id
                      items(first: 100, query: "number:${issueNumber}") {
                        totalCount
                        nodes {
                          id
                          content {
                            ... on Issue {
                              number
                            }
                          }
                        }
                      }
                      fields(first: 20) {
                        nodes {
                          id
                          name
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                          ... on ProjectV2Field {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const detailsResult = await github.graphql(getProjectDetailsQuery);
              const projectDetails = detailsResult.node;

              core.info(`🔍 Детали проекта "${project.title}":`);
              core.info(`   ID: ${projectDetails.id}`);
              core.info(`   Items найдено: ${projectDetails.items.totalCount}`);
              core.info(`   Все items: ${JSON.stringify(projectDetails.items.nodes, null, 2)}`);
              core.info(`   Все поля в проекте: ${JSON.stringify(projectDetails.fields.nodes, null, 2)}`);

              const projectItem = projectDetails.items.nodes[0];
              if (!projectItem) {
                core.error(`❌ Issue #${issueNumber} не найден в items проекта "${project.title}"`);
                core.error(`Total items в проекте: ${projectDetails.items.totalCount}`);
                return;
              }

              core.info(`✓ Найден item для issue #${issueNumber} (ID: ${projectItem.id})`);

              const statusField = projectDetails.fields.nodes.find(f => f.name === 'Status');
              if (!statusField) {
                const fieldNames = projectDetails.fields.nodes.map(f => f.name).join(', ');
                core.error(`❌ Поле "Status" не найдено. Доступные поля: ${fieldNames}`);
                core.error(`Все поля: ${JSON.stringify(projectDetails.fields.nodes, null, 2)}`);
                return;
              }

              core.info(`✓ Найдено поле Status (ID: ${statusField.id})`);
              core.info(`   Все опции Status: ${JSON.stringify(statusField.options, null, 2)}`);

              const inReviewOption = statusField.options?.find(o => o.name === 'In review');
              if (!inReviewOption) {
                const optionNames = statusField.options?.map(o => o.name).join(', ') || 'нет опций';
                core.error(`❌ Статус "In review" не найден. Доступные статусы: ${optionNames}`);
                core.error(`Все опции: ${JSON.stringify(statusField.options, null, 2)}`);
                return;
              }

              core.info(`✓ Найден статус "In review" (ID: ${inReviewOption.id})`);
              core.info(`✓ Готово к обновлению: projectId=${project.id}, itemId=${projectItem.id}, fieldId=${statusField.id}, optionId=${inReviewOption.id}`);

              const projectId = project.id;
              const projectItemId = projectItem.id;
              const statusFieldId = statusField.id;

              // Обновляем статус на "In review"
              const updateMutation = `
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${projectId}"
                    itemId: "${projectItemId}"
                    fieldId: "${statusFieldId}"
                    value: {singleSelectOptionId: "${inReviewOption.id}"}
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;

              core.info(`🚀 Выполняю mutation для обновления статуса...`);
              core.info(`Mutation query:\n${updateMutation}`);

              const mutationResult = await github.graphql(updateMutation);
              core.info(`✅ Результат mutation: ${JSON.stringify(mutationResult, null, 2)}`);
              core.info(`✓ Issue #${issueNumber} переведён в статус "In review" в проекте "${project.title}"`);

            } catch (error) {
              core.error(`❌ Ошибка: ${error.message}`);
              core.error(`Stack: ${error.stack}`);
              core.error(`Полная ошибка: ${JSON.stringify(error, null, 2)}`);
              core.setFailed(`Ошибка: ${error.message}`);
            }
