name: Обновить статус в проекте при ревью

on:
  pull_request:
    types: [labeled]

permissions:
  issues: read
  pull-requests: read

jobs:
  update-project-status:
    if: github.event.label.name == 'needs-review'
    runs-on: ubuntu-latest

    steps:
      - name: Перевести issue в "In review" в GitHub Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const prBody = context.payload.pull_request.body || '';

            // Извлекаем номер issue из "Closes #58"
            const issueMatch = prBody.match(/[Cc]loses\s+#(\d+)/);
            if (!issueMatch) {
              core.info('Issue не найден в описании PR. Пропускаем.');
              return;
            }

            const issueNumber = parseInt(issueMatch[1], 10);
            core.info(`Найден issue #${issueNumber}, ищем в GitHub Project...`);

            // GraphQL запрос для получения проекта и обновления статуса
            const query = `
              query {
                organization(login: "Frontend25-26") {
                  projectV2(number: 1) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                    items(first: 100, query: "number:${issueNumber}") {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const result = await github.graphql(query);

              const project = result.organization.projectV2;
              if (!project) {
                core.setFailed('Проект не найден');
                return;
              }

              core.info(`✓ Проект найден, всего полей: ${project.fields.nodes.length}`);

              // Ищем поле "Status" - может быть любой из типов ProjectV2Field
              let statusField = project.fields.nodes.find(f => f.name === 'Status');
              if (!statusField) {
                core.setFailed('Поле Status не найдено в проекте. Доступные поля: ' +
                  project.fields.nodes.map(f => f.name).join(', '));
                return;
              }

              core.info(`✓ Поле Status найдено, ID: ${statusField.id}`);

              // Ищем опцию "In review"
              const inReviewOption = statusField.options?.find(o => o.name === 'In review');
              if (!inReviewOption) {
                const availableOptions = statusField.options?.map(o => o.name).join(', ') || 'нет опций';
                core.setFailed(`Статус "In review" не найден. Доступные статусы: ${availableOptions}`);
                return;
              }

              core.info(`✓ Статус "In review" найден, ID: ${inReviewOption.id}`);

              // Ищем issue в проекте
              const issueItem = project.items.nodes.find(item => item.content?.number === issueNumber);
              if (!issueItem) {
                core.warning(`Issue #${issueNumber} не найден в проекте HackathonBoard`);
                return;
              }

              // Обновляем статус на "In review"
              const updateMutation = `
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${project.id}"
                    itemId: "${issueItem.id}"
                    fieldId: "${statusField.id}"
                    value: {singleSelectOptionId: "${inReviewOption.id}"}
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;

              await github.graphql(updateMutation);
              core.info(`✓ Issue #${issueNumber} переведён в статус "In review" в проекте HackathonBoard`);

            } catch (error) {
              core.warning(`Ошибка при обновлении проекта: ${error.message}`);
            }
