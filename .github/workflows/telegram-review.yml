name: Telegram notify on needs-review

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  issues: write

jobs:
  notify_review_requested:
    if: github.event.label.name == 'needs-review'
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram review request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEWERS: ${{ vars.TELEGRAM_REVIEWERS }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          comments_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          marker="<!-- telegram-review-message:"

          echo "Actor: ${GITHUB_ACTOR}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "PR number: ${PR_NUMBER}"

          if [ -z "${TELEGRAM_REVIEWERS}" ]; then
            echo "TELEGRAM_REVIEWERS repository variable is not set"
            exit 1
          fi

          mapfile -t reviewers < <(printf '%s' "${TELEGRAM_REVIEWERS}" | jq -r '.[]')

          if [ "${#reviewers[@]}" -eq 0 ]; then
            echo "TELEGRAM_REVIEWERS must contain at least one reviewer"
            exit 1
          fi

          reviewer=${reviewers[$RANDOM % ${#reviewers[@]}]}
          text=$(printf 'Нужен ревью для PR: %s\nBranch: %s\nAuthor: @%s\nReviewer: %s\n%s' \
            "${PR_TITLE}" "${PR_BRANCH}" "${PR_AUTHOR}" "${reviewer}" "${PR_URL}")

          telegram_response=$(curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}")

          if [ "$(printf '%s' "${telegram_response}" | jq -r '.ok')" != "true" ]; then
            echo "Telegram sendMessage failed"
            echo "${telegram_response}"
            exit 1
          fi

          message_id=$(printf '%s' "${telegram_response}" | jq -r '.result.message_id')

          if [ -z "${message_id}" ] || [ "${message_id}" = "null" ]; then
            echo "Telegram sendMessage did not return message_id"
            echo "${telegram_response}"
            exit 1
          fi

          comment_body=$(printf '%s%s -->' "${marker}" "${message_id}")
          github_response=$(curl --fail-with-body -sS -X POST "${comments_url}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg body "${comment_body}" '{body: $body}')")

          if [ "$(printf '%s' "${github_response}" | jq -r '.id')" = "null" ]; then
            echo "Failed to save Telegram message id in PR comment"
            echo "${github_response}"
            exit 1
          fi

  delete_review_message:
    if: github.event.label.name == 'review-done'
    runs-on: ubuntu-latest

    steps:
      - name: Delete Telegram review message
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          comments_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          marker="<!-- telegram-review-message:"

          comments=$(curl --fail-with-body -sS -X GET "${comments_url}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json")

          comment_json=$(printf '%s' "${comments}" | jq -c '[.[] | select(.body | startswith("'"${marker}"'"))] | last')
          comment_id=$(printf '%s' "${comment_json}" | jq -r '.id')
          comment_body=$(printf '%s' "${comment_json}" | jq -r '.body')

          if [ -z "${comment_id}" ] || [ "${comment_id}" = "null" ]; then
            echo "No saved Telegram message id found for this PR"
            exit 1
          fi

          message_id=$(printf '%s' "${comment_body}" | sed -nE 's/^<!-- telegram-review-message:([0-9]+) -->$/\1/p')

          if [ -z "${message_id}" ] || ! printf '%s' "${message_id}" | grep -Eq '^[0-9]+$'; then
            echo "Saved Telegram message id is malformed"
            echo "${comment_body}"
            exit 1
          fi

          delete_response=$(curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "message_id=${message_id}")

          if [ "$(printf '%s' "${delete_response}" | jq -r '.ok')" != "true" ]; then
            echo "Telegram deleteMessage failed"
            echo "${delete_response}"
            exit 1
          fi

          curl --fail-with-body -sS -X DELETE "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json"
