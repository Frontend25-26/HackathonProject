name: Telegram notify on needs-review

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify_review_requested:
    if: github.event.label.name == 'needs-review'
    runs-on: ubuntu-latest

    steps:
      - name: Request reviewer and send Telegram message
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_URL: ${{ vars.TELEGRAM_CHAT_URL }}
          TELEGRAM_REVIEWERS: ${{ vars.TELEGRAM_REVIEWERS }}
        with:
          script: |
            const reviewersRaw = process.env.TELEGRAM_REVIEWERS;

            if (!reviewersRaw) {
              core.setFailed('TELEGRAM_REVIEWERS repository variable is not set');
              return;
            }

            let reviewers;
            try {
              reviewers = JSON.parse(reviewersRaw);
            } catch (error) {
              core.setFailed(`TELEGRAM_REVIEWERS must be valid JSON: ${error.message}`);
              return;
            }

            if (!Array.isArray(reviewers) || reviewers.length === 0) {
              core.setFailed('TELEGRAM_REVIEWERS must contain at least one reviewer');
              return;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Проверяем есть ли уже назначенные ревьюеры
            const existingReviewers = context.payload.pull_request.requested_reviewers || [];
            let githubReviewer;
            let telegramReviewer;
            let isExistingReviewer = false;

            if (existingReviewers.length > 0) {
              // Есть уже назначенные ревьюеры - берём первого
              const existingReviewerLogin = existingReviewers[0].login;
              const existingReviewerData = reviewers.find(r => r.github === existingReviewerLogin);

              if (existingReviewerData) {
                githubReviewer = existingReviewerData.github;
                telegramReviewer = existingReviewerData.telegram;
                isExistingReviewer = true;
                core.info(`✓ Ревьюер @${githubReviewer} уже назначен на PR`);
              } else {
                core.warning(`Существующий ревьюер @${existingReviewerLogin} не найден в TELEGRAM_REVIEWERS, используем случайного`);
              }
            }

            // Если ревьюер не найден или его нет - выбираем случайного
            if (!githubReviewer) {
              const selectedReviewer = reviewers[Math.floor(Math.random() * reviewers.length)];
              githubReviewer = selectedReviewer?.github;
              telegramReviewer = selectedReviewer?.telegram;
            }

            if (!githubReviewer) {
              core.setFailed('Each TELEGRAM_REVIEWERS entry must include a github field');
              return;
            }

            if (!telegramReviewer) {
              core.setFailed('Each TELEGRAM_REVIEWERS entry must include a telegram field');
              return;
            }
            const prTitle = context.payload.pull_request.title;
            const prBranch = context.payload.pull_request.head.ref;
            const prUrl = context.payload.pull_request.html_url;
            const prAuthor = context.payload.pull_request.user.login;
            const serviceMarker = 'telegram-review-bot';

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: prNumber,
                name: 'review-done',
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // Если это не существующий ревьюер - назначаем его
            if (!isExistingReviewer) {
              const reviewerResponse = await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: [githubReviewer],
              });

              if (!reviewerResponse.data.requested_reviewers?.some(user => user.login === githubReviewer)) {
                core.setFailed(`Ошибка при назначении ревьюера @${githubReviewer}`);
                return;
              }
            }

            // Формируем сообщение в телеграм
            const reviewerStatus = isExistingReviewer ? '(уже назначен)' : '(новый ревьюер)';
            const text =
              `Review requested for PR: ${prTitle}\n` +
              `Branch: ${prBranch}\n` +
              `Author: @${prAuthor}\n` +
              `Reviewer: ${telegramReviewer} ${reviewerStatus}\n` +
              `${prUrl}`;

            const sendResponse = await fetch(
              `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                  chat_id: process.env.TELEGRAM_CHAT_ID,
                  text,
                }),
              }
            );

            const telegramResult = await sendResponse.json();

            if (!sendResponse.ok || !telegramResult.ok) {
              core.setFailed(`Telegram sendMessage failed: ${JSON.stringify(telegramResult)}`);
              return;
            }

            const messageId = telegramResult.result?.message_id;

            if (!messageId) {
              core.setFailed(`Telegram sendMessage did not return message_id: ${JSON.stringify(telegramResult)}`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existingServiceComment = comments
              .filter(comment => comment.body.includes(`<!-- ${serviceMarker}`))
              .at(-1);

            const commentBody =
              `<!-- ${serviceMarker} message-id:${messageId} reviewer:${githubReviewer} -->\n` +
              `Current reviewer: @${githubReviewer}`;

            if (existingServiceComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingServiceComment.id,
                body: commentBody,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: commentBody,
            });

  delete_review_message:
    if: github.event.label.name == 'review-done'
    runs-on: ubuntu-latest

    steps:
      - name: Delete Telegram review message
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const serviceMarker = 'telegram-review-bot';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const serviceComment = comments
              .filter(comment => comment.body.includes(`<!-- ${serviceMarker}`))
              .at(-1);

            if (!serviceComment) {
              core.setFailed('No saved Telegram message id found for this PR');
              return;
            }

            const messageIdMatch = serviceComment.body.match(/message-id:([0-9]+)/);
            const messageId = messageIdMatch?.[1];

            if (!messageId) {
              core.setFailed(`Saved Telegram message id is malformed: ${serviceComment.body}`);
              return;
            }

            const deleteResponse = await fetch(
              `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/deleteMessage`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                  chat_id: process.env.TELEGRAM_CHAT_ID,
                  message_id: messageId,
                }),
              }
            );

            const deleteResult = await deleteResponse.json();

            if (!deleteResponse.ok || !deleteResult.ok) {
              core.setFailed(`Telegram deleteMessage failed: ${JSON.stringify(deleteResult)}`);
              return;
            }

            await github.rest.issues.deleteComment({
              owner,
              repo,
              comment_id: serviceComment.id,
            });
