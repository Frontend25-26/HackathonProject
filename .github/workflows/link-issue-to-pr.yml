name: Link Issue to PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  link-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Extract issue and sync PR
        uses: actions/github-script@v7
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Поддержка более гибких веток
            const issueMatch = headRef.match(/^(?:feat|fix|refactor|chore|bugfix|ci|docs)\/(\d+)/);

            if (!issueMatch) {
              core.info(`Branch "${headRef}" does not match pattern`);
              return;
            }

            const issueNumber = Number(issueMatch[1]);

            // Получаем актуальное состояние PR (важно для избежания race condition)
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            const prBody = pr.body || '';
            const prTitle = pr.title || '';

            const marker = `linked-issue:${issueNumber}`;
            const closesText = `Closes #${issueNumber}`;

            const alreadyLinked =
              prBody.includes(marker) ||
              new RegExp(`(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\\s+#${issueNumber}`, 'i')
                .test(prBody);

            try {
              // Проверяем issue
              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });

              core.info(`Found issue #${issueNumber}: ${issue.title}`);

              // 1. Добавляем комментарий (идемпотентно)
              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issueNumber,
              });

              const commentExists = comments.data.some(c =>
                c.body?.includes(`PR: #${prNumber}`)
              );

              if (!commentExists) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `**PR:** #${prNumber}\n\nBranch: \`${headRef}\``,
                });

                core.info(`Comment added to issue #${issueNumber}`);
              } else {
                core.info(`Comment already exists, skipping`);
              }

              // 2. Обновляем PR body (Closes + marker)
              if (!alreadyLinked) {
                const updatedBody = [
                  prBody,
                  '',
                  `${closesText}`,
                  `<!-- ${marker} -->`,
                ].join('\n').trim();

                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: prNumber,
                  body: updatedBody,
                });

                core.info(`PR body updated`);
              } else {
                core.info(`PR already linked to issue`);
              }

              // 3. Обновляем title PR = title issue
              if (prTitle !== issue.title) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: prNumber,
                  title: issue.title,
                });

                core.info(`PR title updated to: "${issue.title}"`);
              }

            } catch (error) {
              const status = error.status || error.response?.status;

              if (status === 404) {
                core.warning(`Issue #${issueNumber} not found`);
                return;
              }

              core.setFailed(`Unexpected error: ${error.message}`);
            }
